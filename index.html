<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talk & Call 연결 중...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #1e293b;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      max-width: 320px;
      width: 100%;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 17px; margin: 0 0 8px 0; color: #0f172a; font-weight: 700; }
    p { font-size: 13px; color: #64748b; margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card" id="status-card">
    <div class="spinner" id="spinner"></div>
    <h2 id="title">대화방 연결 중</h2>
    <p id="desc">실시간 안전 대화방으로 연결하고 있습니다...</p>
  </div>

  <script>
    // 1. 자동 로그인 계정 동기화 (iframe 모드)
    if (window.location.hash.startsWith('#sync=')) {
      const raw = window.location.hash.slice(6);
      if (raw === 'clear') {
        localStorage.removeItem('talk_saved_account');
      } else {
        try {
          const decoded = decodeURIComponent(escape(atob(raw)));
          localStorage.setItem('talk_saved_account', decoded);
        } catch (e) {}
      }
      document.body.innerHTML = '';
      // iframe에서는 리다이렉트하지 않고 대기
    } else {
      // 2. 일반 방문 시 리다이렉트
      async function redirect() {
        try {
          const res = await fetch('https://kvdb.io/2DZmKeioXVnwvtF7hLgkaN/current_url?nocache=' + Date.now());
          if (res.ok) {
            const targetUrl = (await res.text()).trim();
            if (targetUrl && targetUrl.startsWith('http')) {
              let finalUrl = targetUrl;
              // 저장된 로그인 정보가 있다면 새 도메인으로 해시 전달
              const saved = localStorage.getItem('talk_saved_account');
              if (saved) {
                try {
                  const b64 = btoa(unescape(encodeURIComponent(saved)));
                  finalUrl += (finalUrl.includes('#') ? '&' : '#') + 'auth=' + b64;
                } catch (e) {}
              }
              window.location.replace(finalUrl);
              return;
            }
          }
        } catch (err) {
          console.error(err);
        }
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('title').textContent = '서버 준비 중';
        document.getElementById('title').style.color = '#e11d48';
        document.getElementById('desc').innerHTML = '현재 컴퓨터에서 서버가 꺼져 있습니다.<br><br>호스트 컴퓨터에서 <b>start.bat</b>을 실행한 뒤 잠시 후 새로고침해 주세요.';
      }
      redirect();
    }
  </script>
</body>
</html>
